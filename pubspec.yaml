name: ai_assistant_app
description: A new Flutter project for AI Assistant.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Code Gen (Annotations)
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Network
  dio: ^5.4.0
  retrofit: ^4.0.3

  # Auth & Backend
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  google_sign_in: ^6.1.6
  googleapis: ^13.0.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # UI/UX
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.0
  intl: ^0.19.0

  # Voice & Audio
  flutter_tts: ^3.8.3
  audioplayers: ^5.2.1
  # record: ^5.1.0 # Commented out until needed to avoid permission setup issues in early phase

  # Utils
  uuid: ^4.3.3
  fpdart: ^1.1.0
  webfeed: ^0.8.0

  # Platform
  url_launcher: ^6.2.2
  # android_intent_plus: ^4.0.0 # Add when focusing on Android specific features

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  retrofit_generator: ^8.0.0
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
